<div class="history-container py-3">
  
  <!-- Header Row: Title & Add Action -->
  <div class="history-top-bar mb-4">
    <h2 class="m-0 fs-4 fw-bold text-secondary">Extra Dirty Rooms</h2>
    <div *ngIf="!isTeamLeaderUser">
      <button 
        mat-raised-button 
        color="primary" 
        class="py-2 px-4 fs-6 rounded-1 add-request-btn" 
        (click)="routeToExtraDirtyRoom()">
        ➕ Add Extra Work Dirty Room
      </button>
    </div>
  </div>

  <!-- Search Filter Component -->
  <div class="mb-4">
   
  </div>

  <!-- Section Control Bar (Title, Today/Past Toggle, Total Count) -->
  <div class="controls-bar-wrapper mb-4">
    
  </div>

  <!-- Cards Grid Layout -->
  <div class="cards-grid-wrapper">
    
  </div>

  <!-- Paginator -->
  <div class="paginator-wrapper mt-4 d-flex justify-content-center">
   
  </div>

</div>
